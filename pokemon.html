<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon Base Stat Comparison</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
  <h1>Pokémon Base Stat Comparison</h1>
  <p class="subtitle">
    Aggregate base stat analysis by generation of debut.
  </p>
</header>

<main>

  <!-- Controls -->
  <section class="controls">
    <label>
      Generation A
      <select id="gen-a">
        <option value="1">Gen I — Red / Blue</option>
        <option value="2">Gen II — Gold / Silver</option>
        <option value="3">Gen III — Ruby / Sapphire</option>
      </select>
    </label>

    <span class="vs">vs</span>

    <label>
      Generation B
      <select id="gen-b">
        <option value="2">Gen II — Gold / Silver</option>
        <option value="1">Gen I — Red / Blue</option>
        <option value="3">Gen III — Ruby / Sapphire</option>
      </select>
    </label>

    <button id="compare-btn">Compare</button>
  </section>

  <!-- Summary -->
  <section class="summary">
    <h2>Average Total Base Stats</h2>
    <div class="avg-row">
      <div>
        <span id="gen-a-label">—</span>
        <strong id="gen-a-avg">—</strong>
      </div>
      <div>
        <span id="gen-b-label">—</span>
        <strong id="gen-b-avg">—</strong>
      </div>
    </div>
  </section>

  <!-- Metrics -->
  <section class="metrics">
    <table>
      <thead>
        <tr>
          <th>Metric</th>
          <th>Generation A</th>
          <th>Generation B</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Median Base Stats</td>
          <td id="gen-a-median">—</td>
          <td id="gen-b-median">—</td>
        </tr>
        <tr>
          <td>Standard Deviation</td>
          <td id="gen-a-std">—</td>
          <td id="gen-b-std">—</td>
        </tr>
        <tr>
          <td>Pokémon Introduced</td>
          <td id="gen-a-count">—</td>
          <td id="gen-b-count">—</td>
        </tr>
      </tbody>
    </table>
  </section>

</main>

<footer>
  <p>
    Each Pokémon is counted only in the generation it debuted.
  </p>
</footer>

<script src="main.js"></script>
</body>
</html>
